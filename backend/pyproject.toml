[project]
name = "picow-ws2812-workspace"
version = "0.1.0"
description = "Pi5 Server + Pico W LED Wall Streaming"
authors = [{ name = "Giorgio Caizzi", email = "giocaizzi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-cov>=4.1",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "ipympl>=0.9",
    "ruff>=0.9",
    "picow-ws2812",
    "picow-ws2812-devtools",
    "ledwall-server",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
picow-ws2812 = { workspace = true }
picow-ws2812-devtools = { workspace = true }
ledwall-server = { workspace = true }

[tool.ruff]
line-length = 88
exclude = [
    "libs/picow-ws2812/picow_ws2812/neopixel.py",
    "libs/picow-ws2812/picow_ws2812/fonts.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["picow_ws2812", "picow_ws2812_devtools", "ledwall_server"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report xml --cov-report html --cov-report lcov --import-mode=importlib"
