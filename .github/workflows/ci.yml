name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    needs: [secrets]
    if: always()
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - name: Require secrets job
        if: needs.secrets.result != 'success'
        run: |
          echo "secrets job: ${{ needs.secrets.result }}"
          exit 1
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: make check
