# pre-commit configuration
# https://pre-commit.com/
# use pre-commit hooks to enforce code style
repos:
  # ------------------------------
  # General Code Style rules
  # ------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # check credentials
      - id: detect-private-key
      # test names are correct
      - id: name-tests-test
        args: [--pytest-test-first]
      # checks for files that contain merge conflict strings
      - id: check-merge-conflict
      # checks toml files for parseable syntax.
      - id: check-toml
      # checks yaml files for parseable syntax.
      - id: check-yaml
      # check JSON
      - id: check-json
      # ensures that a file is either empty, or ends with one newline.
      - id: end-of-file-fixer
      # trims trailing whitespace
      - id: trailing-whitespace
  # ------------------------------
  # Python
  # ------------------------------
  # # Bandit
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.9
  #   hooks:
  #     - id: bandit
  # ruff: linter (incl. isort) and formatter, configured in pyproject.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # blacken-docs: run black in python codeblocks
  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.18.0
    hooks:
      - id: blacken-docs
  # ------------------------------
  # Markdown
  # ------------------------------
  # mdformat: format markdown files
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
  # ------------------------------
  # uv
  # ------------------------------
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.2
    hooks:
      - id: uv-lock
