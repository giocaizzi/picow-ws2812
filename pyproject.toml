[project]
name = "picow-ws2812-workspace"
version = "0.1.0"
description = ""
authors = [{ name = "giocaizzi", email = "giocaizzi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["picow-ws2812", "ledwall-server"]

[dependency-groups]
test = ["pytest>=8.1.1,<10.0.0", "pytest-cov>=4.1.0,<8"]
dev = [
    "pre-commit>=3.7.1,<5",
    "picow-ws2812-devtools",
    "ruff",
    "mypy>=2.4.0",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
picow-ws2812 = { workspace = true }
picow-ws2812-devtools = { workspace = true }
ledwall-server = { workspace = true }

# test configuration
[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov --cov-report xml --cov-report html --cov-report lcov"


# format and code quality

[tool.ruff]
extend-exclude = ["libs/picow-ws2812/picow_ws2812/fonts.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# mirrors the former flake8 excludes; neopixel.py is PIO assembly
exclude = [
    "libs/picow-ws2812/picow_ws2812/neopixel.py",
    "libs/**/tests/*",
]

[tool.mypy]
python_version = "3.10"
files = ["libs", "main.py"]
# MicroPython modules (machine, rp2, utime) have no host stubs
ignore_missing_imports = true

