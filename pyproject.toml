[project]
name = "picow-ws2812"
version = "0.1.0"
description = ""
authors = [{ name = "giocaizzi", email = "giocaizzi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["picow-ws2812-core", "picow-ws2812-driver"]

[dependency-groups]
test = ["pytest>=8.1.1,<10.0.0", "pytest-cov>=4.1.0,<5"]
dev = [
    "pre-commit>=3.7.1,<4",
    "ipykernel>=6.29.5,<7",
    "ipympl>=0.9.6,<0.10",
    "picow-ws2812-devtools",
    "ruff",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
picow-ws2812-core = { workspace = true }
picow-ws2812-driver = { workspace = true }
picow-ws2812-devtools = { workspace = true }

# test configuration
[tool.pytest.ini_options]
addopts = "--cov --cov-report xml --cov-report html --cov-report lcov"


# format and code quality

[tool.ruff]
extend-exclude = ["libs/picow-ws2812-core/picow_ws2812_core/fonts.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# mirrors the former flake8 excludes; neopixel.py is PIO assembly
exclude = [
    "libs/picow-ws2812-driver/picow_ws2812_driver/neopixel.py",
    "libs/**/tests/*",
    "notebooks/*",
]
