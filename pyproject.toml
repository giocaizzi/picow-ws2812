[project]
name = "picow-ws2812"
version = "0.1.0"
description = ""
authors = [{ name = "giocaizzi", email = "giocaizzi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["picow-ws2812-core", "picow-ws2812-driver"]

[dependency-groups]
test = ["pytest>=8.1.1,<10.0.0", "pytest-cov>=4.1.0,<8"]
dev = [
    "pre-commit>=3.7.1,<5",
    "ipykernel>=6.29.5,<8",
    "ipympl>=0.9.6,<0.11",
    "picow-ws2812-devtools",
    "ruff",
    "mypy>=2.4.0",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
picow-ws2812-core = { workspace = true }
picow-ws2812-driver = { workspace = true }
picow-ws2812-devtools = { workspace = true }

# test configuration
[tool.pytest.ini_options]
addopts = "--cov --cov-report xml --cov-report html --cov-report lcov"


# format and code quality

[tool.ruff]
extend-exclude = ["libs/picow-ws2812-core/picow_ws2812_core/fonts.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# mirrors the former flake8 excludes; neopixel.py is PIO assembly
exclude = [
    "libs/picow-ws2812-driver/picow_ws2812_driver/neopixel.py",
    "libs/**/tests/*",
    "notebooks/*",
]

[tool.mypy]
python_version = "3.10"
files = ["libs", "main.py", "ledwall.py"]
# MicroPython modules (machine, rp2, utime) have no host stubs
ignore_missing_imports = true

# Pre-existing type debt (BaseObject | Collection unions, stale ledwall.py script); fix per module and drop.
[[tool.mypy.overrides]]
module = [
    "ledwall",
    "picow_ws2812_core.base",
    "picow_ws2812_core.collections.group",
    "picow_ws2812_driver.ledwall",
]
ignore_errors = true
